<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAF // NEWSFEED — EVENTS CALENDAR</title>

  <link rel="stylesheet" href="style.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

  <script src="events.js"></script>
</head>
<body>

  <div class="frame">

    <div class="statusbar">
      <span>
        <span class="dot"></span>
        <a href="index.html" style="color: inherit; text-decoration: none;">BRIEFINGS</a> &nbsp;//&nbsp; 
        <span style="color: var(--phosphor);">OPERATIONAL TIMELINES</span>
      </span>
      <span id="clock">SECTOR TIME —</span>
    </div>

    <header class="hero">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="radar"></div>
      <div class="eyebrow">// OPERATIONAL TIMELINES</div>
      <h1>EVENTS CALENDAR<span class="cursor">&nbsp;</span></h1>
      <p>Deployment dates, seasonal qualifiers, and community cast schedules. Synchronize your systems.</p>
    </header>

    <div id="calendar-root"></div>

  </div>

  <script>
// ===== 1. SECTOR DUAL-CLOCK ENGINE (UTC / LOCAL) =====
    function updateClock(){
      var el = document.getElementById('clock');
      if(!el) return;
      
      const now = new Date();
      
      // 1. Calculate UTC Sector Target
      const utcTime = now.toUTCString().split(' ')[4];
      
      // 2. Calculate Local Machine Tracking Metrics
      const localHours = String(now.getHours()).padStart(2, '0');
      const localMinutes = String(now.getMinutes()).padStart(2, '0');
      const localSeconds = String(now.getSeconds()).padStart(2, '0');
      const localTime = localHours + ':' + localMinutes + ':' + localSeconds;
      
      // 3. Render clean HUD readout string
      el.innerHTML = 'SECTOR TIME — ' + utcTime + ' UTC &nbsp;//&nbsp; LOCAL — ' + localTime;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ===== 2. CALENDAR INITIALIZATION =====
    document.addEventListener('DOMContentLoaded', function() {
      var calendarEl = document.getElementById('calendar-root');
      
      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek'
        },
        
        // Bypasses file:// sandbox locks by assigning the global array cleanly
        events: typeof fafEventsData !== 'undefined' ? fafEventsData : [],
        
        eventClick: function(info) {
          if (info.event.url) {
            info.jsEvent.preventDefault();
            window.open(info.event.url, '_blank');
          }
        }
      });

      calendar.render();
    });
  </script>

</body>
</html>
