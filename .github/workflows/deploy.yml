name: Deploy Tactical News Hub

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *' # Updates your data cache automatically every single hour
  workflow_dispatch: # Keeps the manual "Run workflow" button active in your dashboard

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Transmission Stream
        run: node build.js

      - name: Move Assets to Distribution Space
        run: |
          cp index.html dist/index.html
          cp style.css dist/style.css

      - name: Deploy Compiled Distribution to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages