name: Deploy Tactical News Hub

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *' # Triggers automatically every single hour
  workflow_dispatch: # Allows manual override updates via a dashboard click

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull Data and Compile Static Site
        run: node build.js

      - name: Deploy Compiled Distribution to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages