<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAF // NEWSFEED — EVENTS CALENDAR</title>

  <link rel="stylesheet" href="assets/css/core.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/calendar.css">
  <script src="assets/js/engine.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

  <script src="events.js"></script>
</head>
<body>

  <div class="frame">

    <div class="statusbar">
      <span>
        <span class="dot"></span>
        <a href="index.html" style="color: inherit; text-decoration: none;">BRIEFINGS</a> &nbsp;//&nbsp; 
        <span style="color: var(--phosphor);">OPERATIONAL TIMELINES</span> &nbsp;//&nbsp; 
        <a href="archive.html" style="color: inherit; text-decoration: none;">DATABANK_ARCHIVE</a>
      </span>
      <span id="clock">SECTOR TIME —</span>
    </div>

    <header class="hero">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="radar"></div>
      <div class="eyebrow">// OPERATIONAL TIMELINES</div>
      <h1>EVENTS CALENDAR<span class="cursor">&nbsp;</span></h1>
      <p>Deployment dates, seasonal qualifiers, and community cast schedules. Synchronize your systems.</p>
    </header>

    <div style="display: flex; justify-content: flex-end; margin-bottom: 12px;">
      <button id="week-start-toggle" style="background: rgba(0,0,0,0.2); border: 1px solid var(--phosphor-dim); color: var(--phosphor); font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 0.1em; padding: 6px 12px; cursor: pointer;">
        WEEK START: SUNDAY
      </button>
    </div>

    <div id="calendar-root"></div>

  </div>

<script>
    // Note: The Sector Clock is now automatically handled in the background by engine.js!

    // ===== CALENDAR INITIALIZATION =====
    document.addEventListener('DOMContentLoaded', function() {
      var calendarEl = document.getElementById('calendar-root');
      
      // --- TIMEZONE INTERCEPTOR ---
      var processedEvents = [];
      if (typeof fafEventsData !== 'undefined') {
        processedEvents = fafEventsData.map(function(ev) {
          if (ev.start && ev.start.indexOf('T') !== -1) {
            var utcString = ev.start.endsWith('Z') ? ev.start : ev.start + 'Z';
            var localDate = new Date(utcString);
            var hrs = String(localDate.getHours()).padStart(2, '0');
            var mins = String(localDate.getMinutes()).padStart(2, '0');
            
            return Object.assign({}, ev, {
              title: ev.title + ' [' + hrs + ':' + mins + ' LOCAL]',
              start: utcString 
            });
          }
          return ev; 
        });
      }

      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        firstDay: 0, // Starts on Sunday by default
        displayEventTime: false, 
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek'
        },
        
        events: processedEvents,
        
        eventDidMount: function(info) {
          if (info.event.extendedProps.description) {
            info.el.title = info.event.extendedProps.description;
          }
        },
        
        // --- MODAL CLICK INTERCEPT ---
        eventClick: function(info) {
          info.jsEvent.preventDefault(); 

          var modal = document.getElementById('event-modal');
          var titleEl = document.getElementById('modal-title');
          var dateEl = document.getElementById('modal-date');
          var descEl = document.getElementById('modal-desc');
          var linkEl = document.getElementById('modal-link');

          titleEl.textContent = info.event.title;
          
          var sd = info.event.start;
          var months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
          dateEl.textContent = 'DATE: ' + String(sd.getDate()).padStart(2, '0') + ' ' + months[sd.getMonth()] + ' ' + sd.getFullYear();

          descEl.textContent = info.event.extendedProps.description || 'No additional intel provided for this timeline event.';

          if (info.event.url) {
            linkEl.href = info.event.url;
            linkEl.style.display = 'inline-block';
          } else {
            linkEl.style.display = 'none';
          }

          modal.style.display = 'flex';
        }
      });

      calendar.render();
      
      // --- MODAL CLOSE LOGIC ---
      document.getElementById('modal-close').addEventListener('click', function() {
        document.getElementById('event-modal').style.display = 'none';
      });

      document.getElementById('event-modal').addEventListener('click', function(e) {
        if (e.target === this) {
          this.style.display = 'none';
        }
      });

      // --- WEEK START TOGGLE LOGIC ---
      var weekStartsMonday = false;
      var toggleBtn = document.getElementById('week-start-toggle');
      
      if (toggleBtn) {
        toggleBtn.addEventListener('click', function() {
          weekStartsMonday = !weekStartsMonday;
          calendar.setOption('firstDay', weekStartsMonday ? 1 : 0);
          toggleBtn.textContent = 'WEEK START: ' + (weekStartsMonday ? 'MONDAY' : 'SUNDAY');
          
          toggleBtn.style.backgroundColor = 'var(--phosphor)';
          toggleBtn.style.color = 'var(--void)';
          setTimeout(() => {
            toggleBtn.style.backgroundColor = 'rgba(0,0,0,0.2)';
            toggleBtn.style.color = 'var(--phosphor)';
          }, 150);
        });
      }
    });
  </script>

</body>
</html>
